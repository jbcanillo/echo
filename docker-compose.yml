services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Cache downloaded TTS models between restarts
      - tts-models:/app/models

volumes:
  tts-models:
